def ciMainMethodTestTasks = ciMainMethodTests.collect { testClassName ->
    def taskProvider = mainMethodTestTasksByClass[testClassName]

    if (taskProvider == null) {
        throw new GradleException(
                "CI main-method test is not registered: ${testClassName}"
        )
    }

    return taskProvider
}

tasks.register('runCiSmokeTests') {
    group = 'verification'
    description = 'Runs the compact main-method smoke suite used by CI.'
    dependsOn ciMainMethodTestTasks
}

tasks.register('runMainMethodTests') {
    group = 'verification'
    description =
            'Runs every repository test class using main-method assertions.'
    dependsOn mainMethodTestTasksByClass.values()
}
