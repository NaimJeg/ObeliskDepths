def requiredWorldgenResources = [
        'data/obeliskdepths/worldgen/biome/great_swamp.json',
        'data/obeliskdepths/worldgen/noise_settings/obelisk_depths.json',
]
def generatedResourcesRoot = layout.projectDirectory.dir('src/generated/resources')
def processedResourcesRoot = layout.buildDirectory.dir('resources/main')
def jarArchive = tasks.named('jar').flatMap { it.archiveFile }

tasks.register('verifyGeneratedWorldgenResources') {
    group = 'verification'
    description = 'Verifies generated dynamic-registry resources exist in src/generated/resources.'
    inputs.dir generatedResourcesRoot
    doLast {
        requiredWorldgenResources.each { relativePath ->
            def fileToCheck = generatedResourcesRoot.file(relativePath).asFile
            if (!fileToCheck.isFile()) {
                throw new GradleException(
                        "Missing generated dynamic-registry resource: ${fileToCheck}"
                )
            }
        }
    }
}

tasks.register('verifyProcessedWorldgenResources') {
    group = 'verification'
    description = 'Verifies generated dynamic-registry resources are copied to build/resources/main.'
    dependsOn tasks.named('processResources')
    doLast {
        requiredWorldgenResources.each { relativePath ->
            def fileToCheck = processedResourcesRoot.get()
                    .file(relativePath)
                    .asFile
            if (!fileToCheck.isFile()) {
                throw new GradleException(
                        "Missing processed dynamic-registry resource: ${fileToCheck}"
                )
            }
        }
    }
}

tasks.register('verifyJarWorldgenResources') {
    group = 'verification'
    description = 'Verifies generated dynamic-registry resources are packaged in the mod jar.'
    dependsOn tasks.named('jar')
    inputs.file jarArchive
    doLast {
        def jarFile = jarArchive.get().asFile
        def entries = [] as Set
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                entries.add(entry.name)
            }
        }
        requiredWorldgenResources.each { relativePath ->
            if (!entries.contains(relativePath)) {
                throw new GradleException(
                        "Missing dynamic-registry resource in jar ${jarFile}: ${relativePath}"
                )
            }
        }
    }
}

tasks.register('verifyJarPortalResources') {
    group = 'verification'
    description = 'Verifies the portal GUI texture and generated languages are packaged in the mod jar.'
    dependsOn tasks.named('jar')
    inputs.file jarArchive
    doLast {
        def jarFile = jarArchive.get().asFile
        def entries = [] as Set
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                entries.add(entry.name)
            }
        }
        [
                'assets/obeliskdepths/textures/gui/container/obelisk_portal.png',
                'assets/obeliskdepths/lang/en_us.json',
                'assets/obeliskdepths/lang/zh_cn.json',
        ].each { relativePath ->
            if (!entries.contains(relativePath)) {
                throw new GradleException(
                        "Missing portal resource in jar ${jarFile}: ${relativePath}"
                )
            }
        }
    }
}

tasks.named('jar').configure {
    dependsOn tasks.named('verifyGeneratedWorldgenResources')
}

tasks.named('runClient').configure {
    dependsOn tasks.named('verifyGeneratedWorldgenResources')
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyProcessedWorldgenResources')
    dependsOn tasks.named('runCiSmokeTests')
    dependsOn tasks.named('verifyJarWorldgenResources')
    dependsOn tasks.named('verifyJarPortalResources')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
/*
 * Standalone main-method tests.
 *
 * Every test keeps an individual JavaExec task for targeted local debugging.
 * The complete collection is not attached to the standard build lifecycle.
 */
def mainMethodTestTasksByClass = [:]

mainMethodTests.each { testClassName ->
    def simpleName =
            testClassName.substring(testClassName.lastIndexOf('.') + 1)

    def taskProvider = tasks.register("run${simpleName}", JavaExec) {
        group = 'verification'
        description = "Runs ${testClassName}."

        dependsOn tasks.named('testClasses')

        classpath = sourceSets.test.runtimeClasspath
        mainClass = testClassName

        if (project.hasProperty('obeliskTestLayoutSeeds')) {
            systemProperty(
                    'obelisk.test.layoutSeeds',
                    project.property('obeliskTestLayoutSeeds').toString()
            )
        }
    }

    mainMethodTestTasksByClass[testClassName] = taskProvider
}

